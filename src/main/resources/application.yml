server:
  port: 8088
  url: http://localhost:8088

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=diario_ciudadano;encrypt=false;trustServerCertificate=true
    username: sa
    password: VINUM25-07
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: true
    
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    
    properties:
      hibernate:
        format_sql: true
        boot:
          allow_jdbc_metadata_access: false
        temp:
          use_jdbc_metadata_defaults: false

  jackson:
    serialization:
      indent-output: true

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html