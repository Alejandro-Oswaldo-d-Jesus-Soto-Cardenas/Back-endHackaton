# docker-compose up -d
# docker-compose down
version: '3'

services:
  sqlserver:
    image: alejandrosotocardenas/sql-server:2022
    container_name: sql-server
    environment:
      SA_PASSWORD: "VINUM25-07"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    networks:
      - my-network

  backend:
    image: alejandrosotocardenas/back-hack:1.0
    container_name: back-end
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - SERVER_URL=http://localhost:8088
    depends_on:
      - sqlserver
    networks:
      - my-network
    command: >
      sh -c "
      echo 'Esperando que SQL Server esté disponible...';
      until nc -z sql-server 1433; do
        echo 'Aún no está listo, esperando 5s...';
        sleep 5;
      done;
      echo 'SQL Server disponible — iniciando backend.';
      java -jar /app/app.jar
      "

  frontend:
    image: alejandrosotocardenas/front-hack:1.0
    container_name: front-end
    ports:
      - "4200:4200" # accedes al frontend por http://<EC2_PUBLIC_IP>:4200
    environment:
      - API_URL=http://back-end:8088/v1/api/
    networks:
      - my-network
    command: >
      sh -c "
      echo '============================================';
      echo '🚀 Iniciando frontend Angular...';
      echo '🌐 Conectando con API en: $API_URL';
      echo '============================================';
      sleep 5;
      nginx -g 'daemon off;'
      "

networks:
  my-network:
    name: my-network   #red compartida, visible desde ambos compose
    driver: bridge